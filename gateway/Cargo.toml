[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tcpserver = { path = "../lib" }
md-5 = "0.10"
des = "0.8"
cbc = "0.1"
byteorder-lite = "0.1.0"
getrandom = "0.4.2"
lazy_static = "1.5.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
encoder = { path = "../encoder" }
gateway-derive = { path = "../gateway-derive" }
futures = "0.3.32"
bcrypt = "0.19.1"
inventory = "0.3.24"
bitflags = "2.13.0"
database = { path = "../database" }
strum = { version = "0.28.0", features = ["derive"] }
encoding_rs = "0.8.35"
chrono = "0.4.45"
axum = "0.8.9"
serde = "1.0.228"
tokio-util = "0.7.18"
flate2 = "1.1.9"
base64 = "0.22.1"
hyper = "1.10.1"
url = "2.5.8"
serde_json = "1.0.150"
console-subscriber = "0.5.0"
ini = "1.3.0"

[features]
disable-o2hook2-mod = []
